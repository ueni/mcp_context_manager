services:
  mcp-context-manager:
    build:
      context: .
      args:
        MCP_CONTEXT_UID: ${MCP_CONTEXT_UID:-1000}
        MCP_CONTEXT_GID: ${MCP_CONTEXT_GID:-1000}
        SERVER_BINARY: ${SERVER_BINARY:-dist/mcp-context-manager-linux-x86_64-musl}
    image: mcp-context-manager:local
    environment:
      HOST: 0.0.0.0
      MCP_CONTEXT_ALLOWED_ROOTS: ${MCP_CONTEXT_ALLOWED_ROOTS:-${MCP_CONTEXT_HOST_ROOT:-${PWD}}}
      MCP_CONTEXT_ROOT_MAPPINGS: ${MCP_CONTEXT_ROOT_MAPPINGS:-${MCP_CONTEXT_HOST_ROOT:-${PWD}}=/workspace-roots}
      MCP_CONTEXT_STATE_DIR: /state
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-localhost,localhost:8000,127.0.0.1,127.0.0.1:8000,mcp-context-manager,mcp-context-manager:8000,mcp-context-manager-mcp-context-manager-1,mcp-context-manager-mcp-context-manager-1:8000}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
      MCP_HTTP_BEARER_TOKEN: ${MCP_HTTP_BEARER_TOKEN:-}
      PORT: 8000
      REPO_PATH: ${MCP_CONTEXT_REPO_PATH:-/workspace-roots}
      MCP_CONTEXT_RETRIEVAL_WORKERS: ${MCP_CONTEXT_RETRIEVAL_WORKERS:-4}
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    tmpfs:
      - /tmp:rw,exec
    volumes:
      - ${MCP_CONTEXT_HOST_ROOT:-${PWD}}:/workspace-roots:ro
      - mcp-context-state:/state

volumes:
  mcp-context-state:
