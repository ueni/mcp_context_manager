services:
  mcp-context-manager:
    build:
      context: .
      args:
        MCP_CONTEXT_UID: ${MCP_CONTEXT_UID:-1000}
        MCP_CONTEXT_GID: ${MCP_CONTEXT_GID:-1000}
    image: mcp-context-manager:local
    environment:
      HOST: 0.0.0.0
      MCP_CONTEXT_ALLOWED_ROOTS: ${MCP_CONTEXT_ALLOWED_ROOTS:-${MCP_CONTEXT_HOST_ROOT:-${PWD}}}
      MCP_CONTEXT_AUTO_UPDATE: ${MCP_CONTEXT_AUTO_UPDATE:-1}
      MCP_CONTEXT_ROOT_MAPPINGS: ${MCP_CONTEXT_ROOT_MAPPINGS:-${MCP_CONTEXT_HOST_ROOT:-${PWD}}=/workspace-roots}
      MCP_CONTEXT_STATE_DIR: /state
      MCP_TRANSPORT: streamable-http
      MCP_CONTEXT_UPDATE_INTERVAL_SECONDS: ${MCP_CONTEXT_UPDATE_INTERVAL_SECONDS:-3600}
      MCP_CONTEXT_UPDATE_PATHS: ${MCP_CONTEXT_UPDATE_PATHS:-pyproject.toml README.md scripts src}
      MCP_CONTEXT_UPDATE_REPO: ${MCP_CONTEXT_UPDATE_REPO:-ueni/mcp_context_manager}
      MCP_CONTEXT_UPDATE_STATE_DIR: /state/release-update
      PORT: 8000
      REPO_PATH: /workspace-roots
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    tmpfs:
      - /tmp
    volumes:
      - ${MCP_CONTEXT_HOST_ROOT:-${PWD}}:/workspace-roots:ro
      - mcp-context-state:/state

volumes:
  mcp-context-state:
