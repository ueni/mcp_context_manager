
<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AgentTonic</title>
  <desc id="desc">AgentTonic GitHub README banner with a custom context-packet routing symbol, tagline, and mcp-context-manager label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mesh" x1="64" y1="64" x2="1536" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <linearGradient id="darkToBlue" x1="126" y1="210" x2="505" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061744"/>
      <stop offset="0.52" stop-color="#0A57B7"/>
      <stop offset="1" stop-color="#21D8E8"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="390" y1="130" x2="532" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22E0E6"/>
      <stop offset="1" stop-color="#1678F3"/>
    </linearGradient>
    <linearGradient id="tonicT" x1="1005" y1="120" x2="1098" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20D5E6"/>
      <stop offset="1" stop-color="#1E6EF2"/>
    </linearGradient>
    <linearGradient id="packetGrad" x1="515" y1="140" x2="630" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23D8E5"/>
      <stop offset="1" stop-color="#197CF0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(438 210) rotate(90) scale(82)">
      <stop offset="0" stop-color="#26DCE8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#26DCE8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DDE9F7" opacity="0.42"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="24" y="24" width="1552" height="372" rx="36"/>
    </clipPath>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <g clip-path="url(#cardClip)">
    <rect x="24" y="24" width="1552" height="372" fill="url(#dots)" opacity="0.65"/>
    <path d="M1040 32C1248 86 1383 173 1558 373" stroke="url(#mesh)" stroke-width="96" stroke-linecap="round" opacity="0.45"/>
    <path d="M53 364C203 285 316 251 511 240" stroke="url(#mesh)" stroke-width="82" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Custom vector mark: source strata compressed through a context authority node into bounded MCP context packets. -->
  <g id="agenttonic-context-mark" transform="translate(44 0)">
    <ellipse cx="438" cy="210" rx="86" ry="86" fill="url(#nodeGlow)"/>

    <path d="M95 122L205 181V201L95 258V122Z" fill="#061744"/>
    <path d="M146 92L278 172V248L146 328V92Z" fill="#08245A"/>
    <path d="M209 64L357 160V260L209 356V64Z" fill="#061744"/>
    <path d="M296 121L421 184V236L296 299V121Z" fill="url(#darkToBlue)"/>

    <path d="M101 149C190 183 275 202 410 202" stroke="white" stroke-width="13" stroke-linecap="round"/>
    <path d="M150 124C229 178 298 197 413 205" stroke="white" stroke-width="13" stroke-linecap="round"/>
    <path d="M214 98C278 171 326 194 416 207" stroke="white" stroke-width="13" stroke-linecap="round"/>
    <path d="M101 271C190 237 275 218 410 218" stroke="white" stroke-width="13" stroke-linecap="round"/>
    <path d="M150 296C229 242 298 223 413 215" stroke="white" stroke-width="13" stroke-linecap="round"/>
    <path d="M214 322C278 249 326 226 416 213" stroke="white" stroke-width="13" stroke-linecap="round"/>

    <path d="M393 151C426 151 447 171 463 195C478 217 501 229 532 229V191C501 191 478 203 463 225C447 249 426 269 393 269C418 240 418 180 393 151Z" fill="url(#cyanBlue)"/>
    <circle cx="448" cy="210" r="44" fill="white"/>
    <circle cx="448" cy="210" r="29" stroke="#0B76DB" stroke-width="9"/>
    <circle cx="448" cy="210" r="12" fill="#18C5E7"/>

    <path d="M491 155H544" stroke="#18C7E7" stroke-width="8" stroke-linecap="round"/>
    <rect x="544" y="137" width="72" height="36" rx="11" fill="url(#packetGrad)"/>
    <path d="M563 149H599" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.76"/>

    <path d="M491 210H575" stroke="#18C7E7" stroke-width="8" stroke-linecap="round"/>
    <rect x="575" y="192" width="72" height="36" rx="11" fill="url(#packetGrad)"/>
    <path d="M594 204H630" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.76"/>

    <path d="M491 265H544" stroke="#18C7E7" stroke-width="8" stroke-linecap="round"/>
    <rect x="544" y="247" width="72" height="36" rx="11" fill="url(#packetGrad)"/>
    <path d="M563 259H599" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.76"/>
  </g>

  <g id="wordmark" transform="translate(0 -1)">
    <text x="704" y="187" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-4" fill="#061744">Agent</text>
    <text x="1022" y="187" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-4" fill="url(#tonicT)">T</text>
    <text x="1085" y="187" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-4" fill="#061744">onic</text>

    <text x="708" y="246" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="38" font-weight="500" fill="#061744">Give AI agents the right context.</text>

    <text x="708" y="310" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="22" font-weight="600" letter-spacing="1.3" fill="#607189">mcp-context-manager</text>
  </g>
</svg>
