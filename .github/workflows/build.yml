name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - dev/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: .downloads
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Validate Rust workspace and dependency policy
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo xtask license-check
          cargo install cargo-audit --locked
          cargo audit --deny warnings
          cargo xtask sbom dist/mcp-context-manager.cdx.json

      - name: Build glibc and musl executables
        run: |
          cmake --preset ci
          cmake --build --preset standalone-ci

      - name: Smoke test glibc executable
        run: python3 scripts/smoke_native_mcp.py dist/mcp-context-manager-linux-x86_64-glibc

      - name: Smoke test musl executable
        run: python3 scripts/smoke_native_mcp.py dist/mcp-context-manager-linux-x86_64-musl

      - name: Build docker image archive
        run: |
          cmake --preset ci
          cmake --build --preset docker-image-archive-ci

      - name: Smoke test Docker image
        run: python3 scripts/smoke_native_image.py mcp-context-manager:linux-x86_64

      - name: Upload glibc executable
        uses: actions/upload-artifact@v4
        with:
          name: mcp-context-manager-linux-x86_64-glibc
          path: dist/mcp-context-manager-linux-x86_64-glibc
          if-no-files-found: error

      - name: Upload musl executable
        uses: actions/upload-artifact@v4
        with:
          name: mcp-context-manager-linux-x86_64-musl
          path: dist/mcp-context-manager-linux-x86_64-musl
          if-no-files-found: error

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: mcp-context-manager-linux-x86_64-musl-image
          path: mcp-context-manager-linux-x86_64-musl-image.tar.gz
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: mcp-context-manager-cyclonedx-sbom
          path: dist/mcp-context-manager.cdx.json
          if-no-files-found: error
