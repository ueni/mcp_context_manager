name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-22.04

    env:
      IMAGE_NAME: mcp-context-manager

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Validate version
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Release workflow must be dispatched from a branch." >&2
            exit 1
          fi
          version="$(cargo xtask release-version --print-canonical "${{ inputs.version }}")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "TAG=${tag}"
          } >> "$GITHUB_ENV"

      - name: Update release version
        run: cargo xtask release-version "$VERSION"

      - name: Commit release version and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock monitor-metrics.py
          if git diff --cached --quiet; then
            echo "Version ${VERSION} is already recorded; refusing to create a release without a version commit." >&2
            exit 1
          fi
          git commit -m "Release ${TAG}"
          git tag -a "$TAG" -m "Release $TAG"

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: .downloads
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Validate Rust workspace and dependency policy
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo xtask license-check
          cargo install cargo-audit --locked
          cargo audit --deny warnings
          cargo xtask sbom "release/mcp-context-manager-${VERSION}.cdx.json"

      - name: Build glibc and musl executables
        run: |
          cmake --preset release-ci
          cmake --build --preset standalone-release-ci
          mkdir -p release
          cp dist/mcp-context-manager-linux-x86_64-glibc "release/mcp-context-manager-${VERSION}-linux-x86_64-glibc"
          cp dist/mcp-context-manager-linux-x86_64-musl "release/mcp-context-manager-${VERSION}-linux-x86_64-musl"

      - name: Smoke test glibc executable
        run: python3 scripts/smoke_native_mcp.py "release/mcp-context-manager-${VERSION}-linux-x86_64-glibc"

      - name: Smoke test musl executable
        run: python3 scripts/smoke_native_mcp.py "release/mcp-context-manager-${VERSION}-linux-x86_64-musl"

      - name: Build Docker image archive
        run: |
          cmake --preset release-ci
          cmake --build --preset docker-image-archive-release-ci

      - name: Smoke test Docker image
        run: python3 scripts/smoke_native_image.py "${IMAGE_NAME}:${VERSION}"

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes "Release $TAG. Artifacts include the Alpine Docker image archive, glibc and musl standalone Linux server executables, checksums, and Sigstore signature bundle."
