name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-22.04

    env:
      IMAGE_NAME: mcp-context-manager

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate version
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Release workflow must be dispatched from a branch." >&2
            exit 1
          fi
          version="$(python3 scripts/set_release_version.py --print-canonical "${{ inputs.version }}")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "TAG=${tag}"
          } >> "$GITHUB_ENV"

      - name: Update release version
        run: python3 scripts/set_release_version.py "$VERSION"

      - name: Commit release version and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml monitor-metrics.py
          if git diff --cached --quiet; then
            echo "Version ${VERSION} is already recorded; refusing to create a release without a version commit." >&2
            exit 1
          fi
          git commit -m "Release ${TAG}"
          git tag -a "$TAG" -m "Release $TAG"

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: .downloads
          key: ${{ runner.os }}-build-downloads-${{ hashFiles('pyproject.toml', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-build-downloads-

      - name: Build glibc and musl executables
        run: |
          cmake --preset release-ci
          cmake --build --preset standalone-release-ci
          mkdir -p release
          cp dist/mcp-context-manager-linux-x86_64-glibc "release/mcp-context-manager-${VERSION}-linux-x86_64-glibc"
          cp dist/mcp-context-manager-linux-x86_64-musl "release/mcp-context-manager-${VERSION}-linux-x86_64-musl"

      - name: Smoke test glibc executable
        run: |
          state_dir="$(mktemp -d)"
          MCP_TRANSPORT=streamable-http \
          HOST=127.0.0.1 \
          PORT=18080 \
          REPO_PATH="$PWD" \
          MCP_CONTEXT_STATE_DIR="$state_dir" \
          "release/mcp-context-manager-${VERSION}-linux-x86_64-glibc" &
          pid="$!"
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf "$state_dir"' EXIT
          for _ in $(seq 1 30); do
            if python -c 'import json, os, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:18080/mcp/healthz", timeout=2)); raise SystemExit(0 if payload.get("ok") is True and payload.get("version") == os.environ["VERSION"] else 1)'
            then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Smoke test musl executable
        run: |
          state_dir="$(mktemp -d)"
          container="mcp-context-manager-musl-smoke"
          docker run --rm -d \
            --name "$container" \
            -p 18080:18080 \
            -e MCP_TRANSPORT=streamable-http \
            -e HOST=0.0.0.0 \
            -e PORT=18080 \
            -e REPO_PATH=/workspace-roots \
            -e MCP_CONTEXT_STATE_DIR=/state \
            -v "$PWD:/workspace-roots" \
            -v "$state_dir:/state" \
            python:3.12-alpine \
            "/workspace-roots/release/mcp-context-manager-${VERSION}-linux-x86_64-musl"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$state_dir"' EXIT
          for _ in $(seq 1 30); do
            if python -c 'import json, os, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:18080/mcp/healthz", timeout=2)); raise SystemExit(0 if payload.get("ok") is True and payload.get("version") == os.environ["VERSION"] else 1)'
            then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build Docker image archive
        run: |
          cmake --preset release-ci
          cmake --build --preset docker-image-archive-release-ci

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes "Release $TAG. Artifacts include the Alpine Docker image archive, glibc and musl standalone Linux server executables, checksums, and Sigstore signature bundle."
