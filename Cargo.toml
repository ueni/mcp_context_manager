[workspace]
members = [
  "src/context-core",
  "src/context-index",
  "src/context-store",
  "src/context-testkit",
  "src/contextd",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/akkodis/mcp-context-manager"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
heed = { version = "=0.22.1", default-features = false }
http-body-util = "0.1.4"
moka = { version = "=0.12.15", features = ["future"] }
notify = "8"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1.13.1"
rmcp = { version = "=2.2.0", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tantivy = "=0.26.1"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
tree-sitter = "0.26.11"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
